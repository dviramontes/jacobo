name = "Jank"
grammar = "clojure"
path_suffixes = ["jank"]
line_comments = ["; "]
tab_size = 2
hard_tabs = false
autoclose_before = "}])"
word_characters = ["*", "+", "!", "-", "_", "'", "?", "<", ">", "="]
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
